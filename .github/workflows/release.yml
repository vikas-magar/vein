name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build CLI (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            asset: macos-aarch64
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install target
        run: rustup target add "${{ matrix.target }}"
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build --locked --release --bin cli --target "${{ matrix.target }}"
      - name: Package release asset
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -eu
          mkdir -p dist
          cp "target/${TARGET}/release/cli" dist/vein
          archive="vein-${ASSET}.tar.gz"
          tar -C dist -czf "$archive" vein
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: |
            vein-${{ matrix.asset }}.tar.gz
            vein-${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [build, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Attach assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading assets only"
            gh release upload "$tag" release-assets/*.tar.gz release-assets/*.sha256 --clobber
          else
            echo "Creating new release $tag"
            gh release create "$tag" \
              --verify-tag \
              --generate-notes \
              --title "$tag" \
              release-assets/*.tar.gz \
              release-assets/*.sha256
          fi

  wasm:
    name: Build browser package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build browser engine
        run: cargo build --locked --release --target wasm32-unknown-unknown -p vein-wasm
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Prepare browser runtime package directory
        run: mkdir -p dist/vein-wasm-web
      - name: Generate JavaScript bindings
        run: >-
          wasm-bindgen target/wasm32-unknown-unknown/release/vein_wasm.wasm
          --target web --out-dir dist/vein-wasm-web --out-name vein_wasm
      - name: Package browser runtime
        run: |
          archive="vein-wasm-web.tar.gz"
          tar -C dist -czf "$archive" vein-wasm-web
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Upload browser release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-wasm-web
          path: |
            vein-wasm-web.tar.gz
            vein-wasm-web.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
