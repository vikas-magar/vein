[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
libc    = { workspace = true }
s2n-quic = { workspace = true }
s2n-quic-core = "0.83.0"
bytes   = { workspace = true }
tokio   = { workspace = true }
arrow   = { workspace = true }
tracing = { workspace = true }
error   = { path = "../error" }
async-trait = { workspace = true }
rand    = { workspace = true }
serde   = { workspace = true }
rkyv    = { workspace = true }
futures = { workspace = true }
async-stream = "0.3"

[dev-dependencies]
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
aya     = { version = "0.13", default-features = false }
s2n-quic-xdp = "0.83.0"
s2n-quic = { version = "1.83.0", features = ["unstable-provider-io-xdp"] }
