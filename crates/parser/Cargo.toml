[package]
name = "parser"
version = "0.1.0"
edition = "2024"
description = "Pipe-syntax SQL parser for the Vein data engine"
license = "MIT"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_imports = "warn"
unused_must_use = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "deny"

[dependencies]
serde = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
ordered-float = { workspace = true, features = ["serde"] }
