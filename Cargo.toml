[workspace]
resolver = "2"
members = ["crates/common", "crates/types", "crates/catalog", "crates/parquet-connector", "crates/exec", "crates/error", "crates/parser", "crates/binder", "crates/cli", "crates/plan", "crates/optimizer", "crates/physical", "crates/functions", "crates/storage", "crates/engine", "crates/wasm"]
exclude = ["vendor/parquet"]
default-members = ["crates/cli"]

[workspace.dependencies]
async-trait = "0.1.89"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
arrow = "60.0.0"
arrow-cmp = "60.0.0"
arrow-row = "60.0.0"
parquet = { version = "60.0.0", default-features = false, features = ["async", "arrow", "snap", "brotli", "flate2-zlib-rs", "lz4", "base64", "simdutf8"] }
opendal = { version = "0.59.3", default-features = false }
bytes = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0.19"
serde = { version = "1.0", features = ["derive", "rc"] }
futures = "0.3"
wasm-bindgen = "0.2"
js-sys = "0.3"
rand = "0.8"
ordered-float = "5.3.0"
strum = { version = "0.28.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

# Benchmarking and profiling profile.
#
# `08-performance-engineering.md` §5 requires benchmark hygiene on an optimized
# build. This derives from `release` but is invoked as `--profile perf`, so no
# `--release` build is ever needed. `debug = 1` keeps line tables for `perf` and
# flamegraphs; `lto = "thin"` trades a little peak throughput for build time.
[profile.perf]
inherits = "release"
lto = "thin"
debug = 1
strip = false

[patch.crates-io]
parquet = { path = "vendor/parquet" }
