[workspace]
resolver = "2"
members = ["crates/common", "crates/types", "crates/catalog", "crates/exec", "crates/error", "crates/parser", "crates/binder", "crates/cli", "crates/plan", "crates/optimizer", "crates/physical"]
default-members = ["crates/cli"]

[workspace.dependencies]
async-trait = "0.1.89"
tokio = { version = "1", features = ["full"] }
arrow = "60.0.0"
parquet = { version = "60.0.0", features = ["async", "arrow"] }
opendal = { version = "0.59.3", features = ["services-fs"] }
bytes = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0.19"
serde = { version = "1.0", features = ["derive", "rc"] }
futures = "0.3"
rand = "0.8"
ordered-float = "5.3.0"
strum = { version = "0.28.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
